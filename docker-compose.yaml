services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    working_dir: /app
    volumes:
      - ./backend:/app

    ports:
      - "3001:3001"

    env_file:
      - ./backend/.env

    depends_on:
      database:
        condition: service_healthy

    networks:
      - app-network

  database:
    image: mysql:8.0
    restart: always

    env_file:
      - ./backend/.env.database

    ports:
      - "33060:3306"

    volumes:
      - db_data:/var/lib/mysql
      - ./backend/database/finance_script.sql:/docker-entrypoint-initdb.d/finance_script.sql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 10

    networks:
      - app-network

volumes:
  db_data:

networks:
  app-network: