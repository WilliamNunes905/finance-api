services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: finance_api
    restart: always
    working_dir: /app

    volumes:
      - ./backend:/app
      - ./backend/finance_script.sql:/docker-entrypoint-initdb.d/finance_script.sql

    ports:
      - 3001:3001

    environment:
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_HOST: database
      MYSQL_PORT: 3306

    depends_on:
      database:
        condition: service_healthy   

  database:
    image: mysql:8.0
    container_name: finance_db
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: financeapi

    ports:
      - "33060:3306"

    volumes:
      - db_data:/var/lib/mysql
      - ./backend/finance_script.sql:/docker-entrypoint-initdb.d/finance_script.sql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5

volumes:
  db_data: